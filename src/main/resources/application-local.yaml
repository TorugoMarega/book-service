spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/book_service
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        show-sql: false
        open-in-view: false

service:
  exchange-service:
    base-url: http://localhost:8000/exchange-service